<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="cabecalho"><!--Cabeçalho do Site-->
        <div class="logo">📽️ cineSENAI</div> <!--DIV Divisão ou Bloco do site-->
        <nav class="menu"><!--Menu de navegação-->
            <a href="index.html">Em cartaz</a>
            <a href="">Em Breve</a>
            <a href="">Preços</a>
            <a href="">Contato</a>
        </nav>
    </header>

    <main class="container">
        <h1 class="titulo-secao">Cadastro para indicações de fimes</h1>
        <p class="subtitulo">Preencha os campos do cadastro para realizar sua incrição no CineSENAI</p>

        <div class="area-inscricao">
            <form action="/processar-cadastro" method="post" class="coluna-form">
                
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required minlength="3" maxlength="50"><br>

                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required minlength="8" maxlength="15"><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required><br>

                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento" required minlength="1900/01/01" maxlength="2026/12/31"><br>

                <label>Período dos Filmes</label><br>
                <input type="radio" id="truno_manha" name="truno" value="manha" required>
                <label for="truno_manha">Manhã</label><br>
                <input type="radio" id="truno_tarde" name="truno" value="tarde">
                <label for="truno_tarde">Tarde</label><br>
                <input type="radio" id="turno_noite" name="truno" value="noite">
                <label for="turno_noite">Noite</label><br>

                <label>Filmes de interesse</label><br>
                <input type="checkbox" id="acao" name="interesse" value="acao">
                <label for="acao">Filme de Ação</label><br>

                <input type="checkbox" id="comedia" name="interesse" value="comedia">
                <label for="comedia">Filme de Comédia</label><br>

                <input type="checkbox" id="terror" name="interesse" value="terror">
                <label for="terror">Filme de Terror</label><br>

                <label for="unidade">Selecione o Cinema</label><br>
                <select name="unidade" id="unidade" required>
                    <option value="" disabled selected>Selecione um Cinema</option>
                    <option value="sp">São Paulo - Capital</option>
                    <option value="sebastianopolis">Sebastianópolis Do Sul</option>
                    <option value="votuporanga">Votuporanga - SP</option>
                    <option value="valentimgentil">Valentim Gentil - SP</option>
                </select><br>

                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">LI e concordo com os Termos de Uso</label><br>

                <button type="submit" class="btn-enviar">Enviar</button>
                <button type="reset" class="btn-limpar">Cancelar</button>

            </form>

            <div class="coluna-midia">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1092.901787534802!2d-49.922587188322446!3d-20.655931279972336!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94bd65916c5a57f3%3A0xb9ed732994ab0abe!2zUGFyw7NxdWlhIFPDo28gU2ViYXN0acOjbw!5e0!3m2!1spt-BR!2sbr!4v1787665701645!5m2!1spt-BR!2sbr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

                <iframe width="560" height="315" src="https://www.youtube.com/embed/OQbBDZJp70w?si=nPJCU4XT-RLMO0Vi" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

        </div>
        
    </main>
</body>
</html>
